services:
  db:
    image: postgres:17-alpine
    container_name: nexora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexora-api
    restart: unless-stopped
    environment:
      # `db` es el nombre del servicio, resuelto por el DNS interno del compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-nexora}@db:5432/${POSTGRES_DB:-nexora}?schema=public
      PORT: ${API_INTERNAL_PORT:-3001}
      # Sin valor por defecto A PROPOSITO: el contenedor corre con NODE_ENV=production
      # y ahi un secreto conocido equivale a no tener ninguno. `make env` lo genera.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET; ejecuta \`make env\` para generarlo}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-3001}:${API_INTERNAL_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Se ejecuta dentro del contenedor: aqui localhost es el propio servicio.
      test:
        - CMD
        - node
        - -e
        - "fetch(`http://localhost:$${process.env.PORT}/health`).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexora-web
    restart: unless-stopped
    environment:
      API_URL: http://api:${API_INTERNAL_PORT:-3001}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
