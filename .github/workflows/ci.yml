name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Las acciones se fijan por hash y no por etiqueta: una etiqueta se puede mover a otro
# commit, y con ella se ejecutaria codigo ajeno con acceso al repositorio. El comentario
# dice que version es cada hash, para poder actualizarlo.

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historial completo: un secreto filtrado hace 20 commits sigue siendo un secreto filtrado.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose

  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    outputs:
      has-report: ${{ steps.report.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los binarios pesan ~114 MB y solo cambian al subir de version de Playwright.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` instala librerias del sistema con apt y depende de repos
      # externos: falla de forma transitoria. Se reintenta en vez de tumbar el CI.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter e2e exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Intento $attempt fallido; reintentando en 15s"
            sleep 15
          done
          exit 1

      # El compose exige un JWT_SECRET y el runner no tiene .env. No es un secreto
      # de verdad: la base del CI se crea y se tira en cada corrida.
      - name: Generate a throwaway signing secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # El mismo compose que se usa en local: si funciona alli, funciona aqui.
      - run: docker compose up -d --build
      # La base del runner nace vacia: sin esto, las tablas no existen.
      - run: make migrate

      # La misma suite que ya paso contra los dobles, ahora contra PostgreSQL.
      # Corre antes que Playwright: si los repositorios mienten, el resto sobra.
      - name: Port contract against PostgreSQL
        run: make test-contract

      - run: pnpm --filter e2e test

      - name: Check report
        id: report
        if: always()
        run: |
          if [ -d apps/e2e/playwright-report ] && [ -n "$(ls -A apps/e2e/playwright-report)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker logs
        if: failure()
        run: docker compose logs --no-color > docker-logs.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.report.outputs.exists == 'true'
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: docker-logs
          path: docker-logs.txt
          retention-days: 7

  publish-report:
    name: Publish report
    needs: [e2e]
    # Se publica aunque las pruebas fallen (un reporte en rojo tambien informa),
    # pero solo si el reporte existe: si el sistema ni siquiera arranco, se
    # conserva publicado el ultimo reporte valido.
    if: always() && github.ref == 'refs/heads/main' && needs.e2e.outputs.has-report == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-report
          path: report
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: report
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
