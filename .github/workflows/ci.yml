name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: un secreto filtrado hace 20 commits sigue siendo un secreto filtrado.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose

  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    outputs:
      has-report: ${{ steps.report.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los binarios pesan ~114 MB y solo cambian al subir de version de Playwright.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` instala librerias del sistema con apt y depende de repos
      # externos: falla de forma transitoria. Se reintenta en vez de tumbar el CI.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter e2e exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Intento $attempt fallido; reintentando en 15s"
            sleep 15
          done
          exit 1

      # El mismo compose que se usa en local: si funciona alli, funciona aqui.
      - run: docker compose up -d --build
      # La base del runner nace vacia: sin esto, las tablas no existen.
      - run: make migrate

      # La misma suite que ya paso contra los dobles, ahora contra PostgreSQL.
      # Corre antes que Playwright: si los repositorios mienten, el resto sobra.
      - name: Port contract against PostgreSQL
        run: make test-contract

      - run: pnpm --filter e2e test

      - name: Check report
        id: report
        if: always()
        run: |
          if [ -d apps/e2e/playwright-report ] && [ -n "$(ls -A apps/e2e/playwright-report)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker logs
        if: failure()
        run: docker compose logs --no-color > docker-logs.txt

      - uses: actions/upload-artifact@v4
        if: always() && steps.report.outputs.exists == 'true'
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-logs
          path: docker-logs.txt
          retention-days: 7

  publish-report:
    name: Publish report
    needs: [e2e]
    # Se publica aunque las pruebas fallen (un reporte en rojo tambien informa),
    # pero solo si el reporte existe: si el sistema ni siquiera arranco, se
    # conserva publicado el ultimo reporte valido.
    if: always() && github.ref == 'refs/heads/main' && needs.e2e.outputs.has-report == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report
      - id: deploy
        uses: actions/deploy-pages@v4
